apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srequireRunAsNonRoot
spec:
  crd:
    spec:
      names:
        kind: K8sRequireRunAsNonRoot
      validation:
        openAPIV3Schema:
          properties:
            message:
              type: string
              default: "Containers must run as non-root and have read-only root filesystem"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirerunasnonroot
        
        violation[{"msg": msg}] {
            container := input.review.object.spec.containers[_]
            not container.securityContext.runAsNonRoot
            msg := sprintf("Container %v must have runAsNonRoot: true", [container.name])
        }
        
        violation[{"msg": msg}] {
            container := input.review.object.spec.containers[_]
            not container.securityContext.readOnlyRootFilesystem
            msg := sprintf("Container %v must have readOnlyRootFilesystem: true", [container.name])
        }
        
        violation[{"msg": msg}] {
            input.review.object.spec.securityContext.runAsUser == 0
            msg := "Pod must not run as root (UID 0)"
        }
